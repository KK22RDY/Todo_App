<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
</head>

<body>
    <input type="text" id="name" placeholder="Enter Name"><br><br>
    <button id="btn">submit</button><br><br>
    <div id="res">Result will appear hereee!</div>
    <script>
        let count=0
        $("#btn").click(function () {
            count++;
            let name=$("#name").val();
            $("#res").html(`
            <h2><i>Welcome, ${name}</i></h2>
            <p>you clicked button ${count} time(s) </p>
            
            
            
            
        `)
            $("#")
        })

    </script>
</body>
</html>
